name = "gurbaniaudioplayerproxy"
main = "src/worker.js"
compatibility_date = "2026-08-30"

# Gateway (default) always runs to check X-App-Origin. Media is the cached 200.
# Per-entrypoint cache needs Wrangler ≥ 4.107.0.
[cache]
enabled = true
cross_version_cache = true

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.Media]
type = "worker"

  [exports.Media.cache]
  enabled = true

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "gurbaniaudioplayerfiles"
